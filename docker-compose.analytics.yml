# Analytics worker sidecar.
#
# Runs the same pipeline the app's "Save & recompute" button queues, as a
# separate process from the Rust API so the API image stays free of Python.
#
#   docker compose -f docker-compose.analytics.yml up -d --build
#
# DATABASE_URL must point at the same Postgres the API uses.

services:
  analytics-worker:
    build:
      context: ./chicken_price_forecast
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "cp_pipeline.cli", "worker", "--poll", "2"]
    restart: unless-stopped
    # the pipeline is memory-hungry for a moment (bootstrap resampling)
    deploy:
      resources:
        limits:
          memory: 1g
