# Analytics worker sidecar.
#
# Runs the same pipeline the app's "Save & recompute" button queues, as a
# separate process from the Rust API so the API image stays free of Python.
#
#   docker compose -f docker-compose.analytics.yml up -d --build
#
# DATABASE_URL must be reachable *from inside the container*. The repo's .env is
# written for local processes (localhost:5432, through the rjdb tunnel), which
# inside a container points at the container itself. Use one of:
#   - the Neon URL from Secrets.toml
#   - postgresql://user:pass@host.docker.internal:5432/rjagro  (Docker Desktop)
#   - postgresql://user:pass@<vps-private-ip>:5432/rjagro      (on the server)

services:
  analytics-worker:
    # Published by .github/workflows/analytics-worker.yml. On a server that has
    # no source checkout, `docker compose pull` fetches this tag; locally,
    # `docker compose up --build` builds it from the package.
    image: sidharthsingh7/rjagro_analytics_worker:latest
    build:
      context: ./chicken_price_forecast
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "cp_pipeline.cli", "worker", "--poll", "2"]
    restart: unless-stopped
    # the pipeline is memory-hungry for a moment (bootstrap resampling)
    deploy:
      resources:
        limits:
          memory: 1g
