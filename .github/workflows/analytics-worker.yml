name: Build and Push Analytics Worker

# Builds chicken_price_forecast/Dockerfile.worker and pushes it to Docker Hub so
# the VPS can pull it instead of building on the box.
#
#   docker pull sidharthsingh7/rjagro_analytics_worker:latest
#   docker run -d --restart unless-stopped --name analytics-worker \
#     -e DATABASE_URL=postgresql://... sidharthsingh7/rjagro_analytics_worker:latest
#
# Secrets required: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Optional: VPS_LINK + ANALYTICS_WEBHOOK_TOKEN to trigger the same webhook the
# backend uses (leave unset and pull manually).

on:
  push:
    branches:
      - main
    paths:
      - "chicken_price_forecast/**"
      - ".github/workflows/analytics-worker.yml"
  workflow_dispatch:

env:
  IMAGE: sidharthsingh7/rjagro_analytics_worker

jobs:
  build:
    name: Build and push worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # the secrets context is not allowed in step-level `if`; surface them as
      # env so the deploy step can be optional without failing the build
      VPS_LINK: ${{ secrets.VPS_LINK }}
      WEBHOOK_TOKEN: ${{ secrets.ANALYTICS_WEBHOOK_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=rjagro analytics worker
            org.opencontainers.image.description=Price pipeline worker: claims queued runs, recomputes every number

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # context is the package, not the repo: the image needs only the
          # pipeline and the event calendar
          context: ./chicken_price_forecast
          file: ./chicken_price_forecast/Dockerfile.worker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Analytics worker image"
            echo ""
            echo "Pushed:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "On the VPS:"
            echo '```bash'
            echo "docker pull ${{ env.IMAGE }}:latest"
            echo "docker stop analytics-worker && docker rm analytics-worker"
            echo "docker run -d --restart unless-stopped --name analytics-worker \\"
            echo "  -e DATABASE_URL=postgresql://USER:PASS@HOST:5432/rjagro \\"
            echo "  ${{ env.IMAGE }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger VPS deploy webhook
        if: success() && env.VPS_LINK != '' && env.WEBHOOK_TOKEN != ''
        run: |
          curl -fsS -X POST \
            "http://${VPS_LINK}?token=${WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"service":"analytics-worker","image_tag":"latest"}'
