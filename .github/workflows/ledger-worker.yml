name: Build and Push Ledger Worker

# Builds chicken_price_forecast/Dockerfile.ledger and pushes the four-model
# prospective ledger worker.
#
#   docker pull sidharthsingh7/rjagro_forecast_ledger:latest
#
# The image is only half a deploy: this worker also needs FORECAST_PROTOCOL_ID
# pinned, because the fingerprint covers the code, the event calendar and the
# statistical package versions. Each run prints the fingerprint for the image it
# just pushed; a container started with a stale pin exits instead of forecasting
# under a different method.
#
# Secrets required: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    branches:
      - main
    # Any change under the package changes the fingerprint (the pipeline and the
    # calendar are hashed into it), so the image is rebuilt broadly on purpose.
    paths:
      - "chicken_price_forecast/**"
      - ".github/workflows/ledger-worker.yml"
  workflow_dispatch:

env:
  IMAGE: sidharthsingh7/rjagro_forecast_ledger

concurrency:
  group: ledger-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and push ledger image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chicken_price_forecast/requirements-ledger.txt

      - name: Install the ledger runtime
        # The same pin file the image installs, so a test pass and the image use
        # one dependency set.
        run: pip install -r chicken_price_forecast/requirements-ledger.txt

      - name: Run ledger tests
        # test_build.py needs the approved MCP snapshot, which is a local research
        # artifact; it skips here and runs where that snapshot exists.
        working-directory: chicken_price_forecast
        run: python -m unittest discover -s forecast_ledger -p 'test_*.py' -v

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=rjagro forecast ledger worker
            org.opencontainers.image.description=Four-model prospective forecast ledger: issues at 00:05 IST and scores against recorded actuals

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./chicken_price_forecast
          file: ./chicken_price_forecast/Dockerfile.ledger
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Read the protocol fingerprint from the image
        id: fp
        run: |
          # --describe touches no database: it prints the fingerprint computed by
          # the pushed image, which is the only value the container will accept.
          id=$(docker run --rm "${{ env.IMAGE }}:latest" \
            python -m forecast_ledger.worker --describe | jq -r .id)
          if ! printf '%s' "$id" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "::error::--describe did not print a protocol fingerprint"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Forecast ledger worker image"
            echo ""
            echo "Pushed:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Protocol fingerprint for this image:"
            echo '```'
            echo "${{ steps.fp.outputs.id }}"
            echo '```'
            echo "Review the definition before pinning it:"
            echo '```bash'
            echo "docker run --rm ${{ env.IMAGE }}:latest \\"
            echo "  python -m forecast_ledger.worker --describe"
            echo '```'
            echo "Then start or restart the worker with that pin:"
            echo '```bash'
            echo "docker pull ${{ env.IMAGE }}:latest"
            echo "docker stop forecast-ledger 2>/dev/null; docker rm forecast-ledger 2>/dev/null"
            echo "docker run -d --restart unless-stopped --name forecast-ledger --memory 2g \\"
            echo "  -e DATABASE_URL=postgresql://USER:PASS@HOST:5432/rjagro \\"
            echo "  -e FORECAST_PROTOCOL_ID=${{ steps.fp.outputs.id }} \\"
            echo "  ${{ env.IMAGE }}:latest"
            echo '```'
            echo "The fingerprint changes with any method, calendar or statistical-package"
            echo "change, so a container left on an old pin will exit rather than issue"
            echo "forecasts under a different method. Nothing here promotes a model."
          } >> "$GITHUB_STEP_SUMMARY"
